<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Sense — live map</title>
<!-- Road Sense map app (v2) with the LIVE Mapbox map. Runs anywhere that may load unpkg.com and
     api.mapbox.com: GitHub Pages, or locally (node tools/render/server.js -> http://localhost:5178/web/).
     The claude.ai canvas can't (its viewer blocks Mapbox), so the canvas keeps the Mapbox images. -->
<base href="app/">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #F6F7F9; }
  body.app { overflow: hidden; background: #EEF0F3; }
  body.app #root { position: absolute; left: 50%; top: 0; width: 390px; height: 844px; transform-origin: 50% 0; }
  body.app .ph { border-radius: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
  // "Road Sense demo" public token: URL-restricted in Mapbox to the demo (github.io/roadsense-demo) and localhost:5178.
  window.RS_MAPBOX_TOKEN = 'pk.eyJ1IjoiYWxhYXNoYWhlZW4iLCJhIjoiY213NG11OHg2MDhmZTJ5c2l5amt3NWVqciJ9.OrxhEM-2llvAp5Xx_Z7pKQ';
</script>
</head>
<body>
<div id="root"></div>
<script src="_dc.js"></script>
<script>
// Phone (narrow screen) or ?app: just the app, scaled to fit. Computer: the board with the side panel.
const q = new URLSearchParams(location.search);
const app = q.has('app') || (!q.has('board') && matchMedia('(max-width: 900px)').matches);
if (app) {
  document.body.className = 'app';
  const fit = () => { const k = Math.min(innerWidth / 390, innerHeight / 844); document.getElementById('root').style.transform = `translateX(-50%) scale(${k})`; };
  fit(); addEventListener('resize', fit);
}
(async () => {
  try {
    const Root = await DC.load('LiveDrive.dc.html');
    ReactDOM.createRoot(document.getElementById('root')).render(DC.h(Root, app ? { app: '1' } : {}));
  } catch (e) { document.body.innerHTML = '<pre style="padding:16px;color:#B91C1C">Could not load the app: ' + e.message + '</pre>'; }
})();
</script>
</body>
</html>
