<script>
// Which app: /cluster/ (demo) or ?cluster (local) = the no-map cluster; else the map app.
const q = new URLSearchParams(location.search);
const local = /\/web\/?$/.test(location.pathname.replace(/cluster\/?$/, ''));
const cluster = /\/cluster\/?$/.test(location.pathname) || q.has('cluster');
const root = location.origin + location.pathname.replace(/cluster\/?$/, '');
// device: phone, tablet landscape (tl, 1194×834) or tablet portrait (tp, drawn 641×918)
const device = ['tl', 'tp'].includes(q.get('device')) ? q.get('device') : 'phone';
const SIZE = { phone: [390, 844], tl: [1194, 834], tp: [641, 918] }[device];
const keep = ['app', 'board'].filter(k => q.has(k)).concat(device !== 'phone' ? ['device=' + device] : []).join('&');
const link = (c) => (c ? (local ? root + '?cluster' + (keep ? '&' + keep : '') : root + 'cluster/' + (keep ? '?' + keep : '')) : root + (keep ? '?' + keep : ''));
const toMap = document.getElementById('to-map'), toCl = document.getElementById('to-cluster');
toMap.href = link(false); toCl.href = link(true);
(cluster ? toCl : toMap).className = 'on'; (cluster ? toCl : toMap).setAttribute('aria-current', 'page');
for (const d of ['phone', 'tl', 'tp']) {
  const a = document.getElementById('d-' + d), u = new URL(location.href);
  if (d === 'phone') u.searchParams.delete('device'); else u.searchParams.set('device', d);
  a.href = u.toString(); if (d === device) { a.className = 'on'; a.setAttribute('aria-current', 'true'); }
}
// Always just the app, scaled to the space next to the controls pane (?board: the old board with the in-app side panel)
const app = !q.has('board');
const WIDE = matchMedia('(min-width: 900px)');
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } };

setBar(); addEventListener('resize', setBar);
let fit = () => {};

  document.body.classList.add('app');
  document.documentElement.style.setProperty('--aw', SIZE[0] + 'px'); document.documentElement.style.setProperty('--ah', SIZE[1] + 'px');
  fit = () => {
    const B = document.body, wide = WIDE.matches; B.classList.toggle('wide', wide);
    const actual = store('rs-demo-size') === 'actual'; B.classList.toggle('actual', actual);
    const bar = document.querySelector('.demo-bar').getBoundingClientRect().height;
    const pane = wide && B.classList.contains('dsh-on') ? document.getElementById('dsh').getBoundingClientRect().width : 0;
    const vw = document.documentElement.clientWidth - pane, vh = (window.visualViewport && visualViewport.height) || innerHeight;
    const G = wide ? 28 : 0; // space around the framed device on a computer

  };

(async () => {

    const Root = await DC.load(cluster ? 'Cluster.dc.html?v=085aaa9-1793974839' : 'LiveDrive.dc.html?v=085aaa9-1793974839');
    ReactDOM.createRoot(document.getElementById('root')).render(DC.h(Root, { ...(app ? { app: '1' } : {}), ...(device !== 'phone' ? { device } : {}) }));
  } catch (e) { document.getElementById('root').innerHTML = '<pre style="padding:16px;color:#B91C1C">Could not load the app: ' + e.message + '</pre>'; }

(() => {

  WIDE.addEventListener && WIDE.addEventListener('change', () => open(WIDE.matches && store('rs-demo-pane') !== 'hidden', true));

    const tl = $('dsh-tl'); tl.max = a.END; if (!dragging) tl.value = Math.round(Math.min(a.END, a.sim ? a.sim.s : 0));

})();
