<style>
  :root { --bar: 52px; --ink: #15181D; --ink2: #5B636E; --line: #E3E6EA; }

  .demo-seg a svg { width: 18px; height: 18px; flex: none; }

  .dsh { position: fixed; left: 0; right: 0; bottom: 0; z-index: 201; height: min(74vh, 640px); box-sizing: border-box; display: flex; flex-direction: column; background: #fff; border-radius: 22px 22px 0 0; box-shadow: 0 -12px 40px -14px rgba(16, 24, 40, .35); transform: translateY(105%); transition: transform .32s cubic-bezier(.2, .8, .2, 1); padding-bottom: env(safe-area-inset-bottom, 0px); max-width: 560px; margin: 0 auto; }

  .dsh-t { font-size: 17px; font-weight: 700; color: var(--ink); }
  .dsh-x { width: 36px; height: 36px; border: 0; border-radius: 18px; background: #EEF0F3; font-size: 18px; cursor: pointer; color: var(--ink); }
  .dsh-sec { padding: 8px 16px; }
  .dsh-k { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #98A0AA; margin-bottom: 6px; }
  .dsh-seg { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: #EEF0F3; }
  .dsh-seg button { height: 38px; border: 0; border-radius: 9px; background: transparent; font: 600 13px/1 Inter, sans-serif; color: var(--ink2); cursor: pointer; }
  .dsh-seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(16, 24, 40, .14); }
  .dsh-ctl { display: flex; align-items: center; gap: 8px; }
  .dsh-btn { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; color: var(--ink); flex: none; }
  .dsh-btn.pri { background: var(--ink); color: #fff; border-color: var(--ink); }
  .dsh-btn svg { width: 18px; height: 18px; }
  .dsh-rate { display: flex; padding: 3px; border-radius: 12px; background: #EEF0F3; }
  .dsh-rate button { height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; font: 600 13px/1 Inter, sans-serif; color: var(--ink2); cursor: pointer; }
  .dsh-rate button.on { background: #fff; color: var(--ink); }
  .dsh-now { margin-left: auto; min-width: 0; font-size: 13px; font-weight: 600; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dsh-tl { width: 100%; margin: 4px 0 0; accent-color: #2563EB; height: 28px; }
  .dsh-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 8px 12px; -webkit-overflow-scrolling: touch; }
  .dsh-sc { width: 100%; display: flex; align-items: center; gap: 10px; padding: 11px 8px; border: 0; border-radius: 12px; background: transparent; text-align: left; cursor: pointer; font: 500 15px/1.25 Inter, sans-serif; color: var(--ink); }
  .dsh-sc.on { background: #EEF2FF; }
  .dsh-sc i { font-style: normal; font-size: 12px; font-weight: 600; color: #98A0AA; width: 20px; flex: none; }

  .dsh-tag.crit { background: #FDEBEC; color: #C62828; } .dsh-tag.warn { background: #FEF3DF; color: #9A5B00; } .dsh-tag.adv { background: #EAF1FE; color: #1D4ED8; } .dsh-tag.ev { background: #1C2026; color: #fff; }

<script src="_dc.js?v=ecb9037-1793972356"></script>
<script>
// Which app: /cluster/ (demo) or ?cluster (local) = the no-map cluster; else the map app.
const q = new URLSearchParams(location.search);
const local = /\/web\/?$/.test(location.pathname.replace(/cluster\/?$/, ''));
const cluster = /\/cluster\/?$/.test(location.pathname) || q.has('cluster');
const root = location.origin + location.pathname.replace(/cluster\/?$/, '');
// device: phone, tablet landscape (tl, 1194×834) or tablet portrait (tp, drawn 641×918)
const device = ['tl', 'tp'].includes(q.get('device')) ? q.get('device') : 'phone';
const SIZE = { phone: [390, 844], tl: [1194, 834], tp: [641, 918] }[device];
const keep = ['app', 'board'].filter(k => q.has(k)).concat(device !== 'phone' ? ['device=' + device] : []).join('&');
const link = (c) => (c ? (local ? root + '?cluster' + (keep ? '&' + keep : '') : root + 'cluster/' + (keep ? '?' + keep : '')) : root + (keep ? '?' + keep : ''));
const toMap = document.getElementById('to-map'), toCl = document.getElementById('to-cluster');
toMap.href = link(false); toCl.href = link(true);
(cluster ? toCl : toMap).className = 'on'; (cluster ? toCl : toMap).setAttribute('aria-current', 'page');
for (const d of ['phone', 'tl', 'tp']) {
  const a = document.getElementById('d-' + d), u = new URL(location.href);
  if (d === 'phone') u.searchParams.delete('device'); else u.searchParams.set('device', d);
  a.href = u.toString(); if (d === device) { a.className = 'on'; a.setAttribute('aria-current', 'true'); }
}
// Phone (narrow screen) or ?app: just the app, scaled to fit under the bar. Computer: the board with the side panel.
const app = q.has('app') || (!q.has('board') && matchMedia(device === 'tl' ? '(max-width: 1700px)' : '(max-width: 900px)').matches);
const setBar = () => document.documentElement.style.setProperty('--barh', document.querySelector('.demo-bar').getBoundingClientRect().height + 'px');
setBar(); addEventListener('resize', setBar);
if (app) {
  document.body.className = 'app';
  document.documentElement.style.setProperty('--aw', SIZE[0] + 'px'); document.documentElement.style.setProperty('--ah', SIZE[1] + 'px');
  const fit = () => {
    const bar = document.querySelector('.demo-bar').getBoundingClientRect().height;
    const vw = document.documentElement.clientWidth, vh = (window.visualViewport && visualViewport.height) || innerHeight;
    const k = Math.min(vw / SIZE[0], (vh - bar) / SIZE[1]);
    document.getElementById('root').style.transform = `scale(${k})`; // centered by margins: never widens the page
  };
  fit(); addEventListener('resize', fit);
}
(async () => {
  try {
    const Root = await DC.load(cluster ? 'Cluster.dc.html?v=ecb9037-1793972356' : 'LiveDrive.dc.html?v=ecb9037-1793972356');
    ReactDOM.createRoot(document.getElementById('root')).render(DC.h(Root, { ...(app ? { app: '1' } : {}), ...(device !== 'phone' ? { device } : {}) }));
  } catch (e) { document.getElementById('root').innerHTML = '<pre style="padding:16px;color:#B91C1C">Could not load the app: ' + e.message + '</pre>'; }
})();
// ---- phone demo sheet: drives the app instance the app registers as window.__rsApp ----
(() => {
  const $ = (id) => document.getElementById(id), body = document.body;
  const PLAY = '<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11a1 1 0 0 0 1.5.9l9-5.5a1 1 0 0 0 0-1.8l-9-5.5A1 1 0 0 0 4 2.5z"/></svg>';
  const PAUSE = '<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
  let listKey = '', timer = null, dragging = false;
  const app = () => window.__rsApp;
  const open = (on) => { body.classList.toggle('dsh-on', on); if (on) { refresh(true); timer = setInterval(refresh, 300); } else clearInterval(timer); };
  $('demo-open').onclick = () => open(true); $('dsh-x').onclick = () => open(false); $('dsh-back').onclick = () => open(false);
  const sceneList = (a) => a.SCENES.map((sc, k) => ({ sc, k })).filter(o => a.sceneFits(o.sc));
  function refresh(force) {
    const a = app(); if (!a || !a.state) return;
    const st = a.state, drive = st.screen === 'drive';
    for (const b of $('dsh-mode').children) b.className = b.dataset.m === a.mode() ? 'on' : '';
    for (const b of document.querySelectorAll('.dsh-rate button')) b.className = +b.dataset.r === st.rate ? 'on' : '';
    const playing = drive && st.playing; $('dsh-play').innerHTML = playing ? PAUSE : PLAY; $('dsh-play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
    const tl = $('dsh-tl'); tl.max = a.END; if (!dragging) tl.value = Math.round(Math.min(a.END, a.sim ? a.sim.s : 0));
    const list = sceneList(a), idx = drive ? a.sceneIdx() : -1;
    $('dsh-now').textContent = !drive ? 'Get started screen' : st.done ? 'Drive complete' : (list.find(o => o.k === idx) || { sc: { name: '' } }).sc.name;
    const key = a.mode() + '|' + idx;
    if (force || key !== listKey) {
      listKey = key;
      $('dsh-list').innerHTML = list.map(({ sc, k }, j) => `<button class="dsh-sc ${k === idx ? 'on' : ''}" data-k="${k}" type="button"><i>${String(j + 1).padStart(2, '0')}</i><span>${sc.name}</span><b class="dsh-tag ${sc.tag}">${sc.tagText}</b></button>`).join('');
    }
  }
  $('dsh-mode').onclick = (e) => { const m = e.target.dataset && e.target.dataset.m; if (m && app()) { app().setMode(m); setTimeout(() => refresh(true), 50); } };
  document.querySelector('.dsh-rate').onclick = (e) => { const r = +(e.target.dataset && e.target.dataset.r); if (r && app()) app().setState({ rate: r }); };
  $('dsh-play').onclick = () => { const a = app(); if (!a) return; if (a.state.screen !== 'drive') { a.permDone = true; a.start(); } else a.togglePlay(); };
  $('dsh-restart').onclick = () => { const a = app(); if (!a) return; const first = sceneList(a)[0]; if (first) a.jump(first.sc); };
  const tl = $('dsh-tl');
  tl.oninput = () => { dragging = true; }; tl.onchange = () => { dragging = false; const a = app(); if (a) { if (a.state.screen !== 'drive') { a.permDone = true; a.start(); } a.scrubTo(+tl.value); } };
  $('dsh-list').onclick = (e) => { const b = e.target.closest('.dsh-sc'); const a = app(); if (!b || !a) return; a.jump(a.SCENES[+b.dataset.k]); open(false); };
})();
</script>
