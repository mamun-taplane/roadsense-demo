<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road Sense — demo</title>
<!-- Road Sense review demo: the map app (v2) with the LIVE Mapbox map, and the no-map cluster app (v4).
     Runs anywhere that may load unpkg.com and api.mapbox.com: GitHub Pages (tools/demo/publish.sh), or
     locally (node tools/render/server.js -> http://localhost:5178/web/ , cluster: /web/?cluster).
     The claude.ai canvas can't (its viewer blocks Mapbox). -->
<base href="../app/">
<!-- Send the full page address to Mapbox: the token is URL-restricted to .../roadsense-demo/, and browsers
     otherwise send only the site (https://mamun-taplane.github.io/), which Mapbox refuses (403). -->
<meta name="referrer" content="no-referrer-when-downgrade">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root { --bar: 52px; --ink: #15181D; --ink2: #5B636E; --line: #E3E6EA; }
  html, body { margin: 0; height: 100%; background: #F6F7F9; font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif; }
  /* demo switch: outside the app, so the app keeps its own screen */
  /* two labeled groups: App (map / no map) and Device (phone / tablet landscape / tablet portrait) */
  .demo-bar { position: fixed; z-index: 100; left: 0; right: 0; top: 0; min-height: calc(var(--bar) + env(safe-area-inset-top, 0px)); padding: env(safe-area-inset-top, 0px) 12px 0; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 6px 32px; align-items: center; justify-content: center; background: #fff; border-bottom: 1px solid var(--line); }
  .demo-grp { display: flex; align-items: center; gap: 10px; margin: 6px 0; }
  .demo-k { font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #98A0AA; }
  .demo-seg { display: flex; gap: 2px; padding: 3px; border-radius: 12px; background: #EEF0F3; }
  .demo-seg a { height: 34px; padding: 0 12px; cursor: pointer; border-radius: 9px; display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; color: var(--ink2); text-decoration: none; white-space: nowrap; user-select: none; }
  .demo-seg a svg { width: 18px; height: 18px; flex: none; }
  .demo-seg a:hover { color: var(--ink); }
  .demo-seg a.on { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(16, 24, 40, .14); }
  .demo-seg a:focus-visible { outline: 2px solid #2563EB; outline-offset: 1px; }
  /* phone: no group labels, short names, device icons only */
  @media (max-width: 760px) { .demo-bar { gap: 6px 14px; padding-left: 6px; padding-right: 6px; } .demo-k, .demo-bar .lg { display: none; } .demo-seg a { height: 32px; padding: 0 9px; font-size: 13px; } .demo-seg a .dv-t { display: none; } }
  #root { padding-top: var(--barh, calc(var(--bar) + env(safe-area-inset-top, 0px))); }
  /* computer: the board (phone + side panel) centered under the bar */
  body:not(.app) #root { display: flex; justify-content: center; }
  body:not(.app) #root > * { flex: 0 0 auto; }
  body.app { overflow: hidden; background: #EEF0F3; }
  body.app #root { position: absolute; left: 50%; top: var(--barh, calc(var(--bar) + env(safe-area-inset-top, 0px))); padding: 0; width: var(--aw, 390px); height: var(--ah, 844px); transform-origin: 50% 0; }
  body.app .ph { border-radius: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
  // "Road Sense demo" public token: URL-restricted in Mapbox to the demo (github.io/roadsense-demo) and localhost:5178.
  // live only: never fall back to the canvas map pictures (a real app has none)
  window.RS_LIVE_ONLY = true;
  window.RS_MAPBOX_TOKEN = 'pk.eyJ1IjoiYWxhYXNoYWhlZW4iLCJhIjoiY213NG11OHg2MDhmZTJ5c2l5amt3NWVqciJ9.OrxhEM-2llvAp5Xx_Z7pKQ';
</script>
</head>
<body>
<nav class="demo-bar" aria-label="Choose the app and the device">
  <div class="demo-grp"><span class="demo-k">App</span><div class="demo-seg" role="group" aria-label="App">
    <a id="to-map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13M15 6.5v13"/></svg><span>Map<span class="lg"> app</span></span></a>
    <a id="to-cluster"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="2"/><rect x="13" y="4" width="8" height="7" rx="2"/><rect x="13" y="13" width="8" height="7" rx="2"/></svg><span>No map<span class="lg"> app</span></span></a>
  </div></div>
  <div class="demo-grp"><span class="demo-k">Device</span><div class="demo-seg" role="group" aria-label="Device">
    <a id="d-phone" title="Phone" aria-label="Phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg><span class="dv-t">Phone</span></a>
    <a id="d-tl" title="Tablet, landscape" aria-label="Tablet, landscape"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M18.5 11v2"/></svg><span class="dv-t">Tablet landscape</span></a>
    <a id="d-tp" title="Tablet, portrait" aria-label="Tablet, portrait"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2.5"/><path d="M11 18.5h2"/></svg><span class="dv-t">Tablet portrait</span></a>
  </div></div>
</nav>
<div id="root"></div>
<script src="_dc.js"></script>
<script>
// Which app: /cluster/ (demo) or ?cluster (local) = the no-map cluster; else the map app.
const q = new URLSearchParams(location.search);
const local = /\/web\/?$/.test(location.pathname.replace(/cluster\/?$/, ''));
const cluster = /\/cluster\/?$/.test(location.pathname) || q.has('cluster');
const root = location.origin + location.pathname.replace(/cluster\/?$/, '');
// device: phone, tablet landscape (tl, 1194×834) or tablet portrait (tp, drawn 641×918)
const device = ['tl', 'tp'].includes(q.get('device')) ? q.get('device') : 'phone';
const SIZE = { phone: [390, 844], tl: [1194, 834], tp: [641, 918] }[device];
const keep = ['app', 'board'].filter(k => q.has(k)).concat(device !== 'phone' ? ['device=' + device] : []).join('&');
const link = (c) => (c ? (local ? root + '?cluster' + (keep ? '&' + keep : '') : root + 'cluster/' + (keep ? '?' + keep : '')) : root + (keep ? '?' + keep : ''));
const toMap = document.getElementById('to-map'), toCl = document.getElementById('to-cluster');
toMap.href = link(false); toCl.href = link(true);
(cluster ? toCl : toMap).className = 'on'; (cluster ? toCl : toMap).setAttribute('aria-current', 'page');
for (const d of ['phone', 'tl', 'tp']) {
  const a = document.getElementById('d-' + d), u = new URL(location.href);
  if (d === 'phone') u.searchParams.delete('device'); else u.searchParams.set('device', d);
  a.href = u.toString(); if (d === device) { a.className = 'on'; a.setAttribute('aria-current', 'true'); }
}
// Phone (narrow screen) or ?app: just the app, scaled to fit under the bar. Computer: the board with the side panel.
const app = q.has('app') || (!q.has('board') && matchMedia(device === 'tl' ? '(max-width: 1700px)' : '(max-width: 900px)').matches);
const setBar = () => document.documentElement.style.setProperty('--barh', document.querySelector('.demo-bar').getBoundingClientRect().height + 'px');
setBar(); addEventListener('resize', setBar);
if (app) {
  document.body.className = 'app';
  document.documentElement.style.setProperty('--aw', SIZE[0] + 'px'); document.documentElement.style.setProperty('--ah', SIZE[1] + 'px');
  const fit = () => {
    const bar = document.querySelector('.demo-bar').getBoundingClientRect().height;
    const k = Math.min(innerWidth / SIZE[0], (innerHeight - bar) / SIZE[1]);
    document.getElementById('root').style.transform = `translateX(-50%) scale(${k})`;
  };
  fit(); addEventListener('resize', fit);
}
(async () => {
  try {
    const Root = await DC.load(cluster ? 'Cluster.dc.html' : 'LiveDrive.dc.html');
    ReactDOM.createRoot(document.getElementById('root')).render(DC.h(Root, { ...(app ? { app: '1' } : {}), ...(device !== 'phone' ? { device } : {}) }));
  } catch (e) { document.getElementById('root').innerHTML = '<pre style="padding:16px;color:#B91C1C">Could not load the app: ' + e.message + '</pre>'; }
})();
</script>
</body>
</html>
