<svg xmlns="http://www.w3.org/2000/svg" width="390" height="470" viewBox="0 0 390 470">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CFE2F7"/>
      <stop offset=".62" stop-color="#EAF1F6"/>
      <stop offset="1" stop-color="#F6F1E6"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9BEDA"/>
      <stop offset="1" stop-color="#C9D7E8"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FA7C6"/>
      <stop offset="1" stop-color="#B7C7DB"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7C828B"/>
      <stop offset="1" stop-color="#454A52"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E4DFD2"/>
      <stop offset="1" stop-color="#F2F0EB"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F0EB" stop-opacity="0"/>
      <stop offset="1" stop-color="#F2F0EB"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE3A3"/>
      <stop offset=".55" stop-color="#FFE9BD" stop-opacity=".7"/>
      <stop offset="1" stop-color="#FFF1D6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#2BC46B" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2BC46B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3D7BFF"/>
      <stop offset="1" stop-color="#2155D9"/>
    </linearGradient>
  </defs>

  <!-- sky and sun -->
  <rect width="390" height="470" fill="url(#sky)"/>
  <circle cx="92" cy="128" r="70" fill="url(#sun)"/>
  <circle cx="92" cy="128" r="22" fill="#FFE7B0"/>

  <!-- Wasatch: far range, near range with snow -->
  <path d="M0 262 L34 228 L58 240 L96 196 L122 216 L150 184 L188 222 L214 204 L246 168 L276 196 L304 182 L338 214 L366 194 L390 206 L390 300 L0 300 Z" fill="url(#far)"/>
  <path d="M246 168 L234 182 L242 179 L248 186 L256 178 L262 183 Z M150 184 L140 196 L147 194 L153 199 L160 193 Z M96 196 L87 207 L94 205 L99 209 Z" fill="#fff" opacity=".9"/>
  <path d="M0 286 L28 262 L60 274 L104 238 L140 262 L176 248 L214 270 L262 236 L300 258 L342 240 L390 262 L390 312 L0 312 Z" fill="url(#near)"/>
  <path d="M104 238 L94 248 L101 246 L106 251 L113 245 Z M262 236 L251 247 L259 245 L265 250 L272 244 Z M342 240 L334 248 L340 247 L346 251 Z" fill="#fff" opacity=".85"/>

  <!-- valley floor -->
  <rect x="0" y="300" width="390" height="170" fill="url(#ground)"/>
  <!-- low buildings on the horizon -->
  <g fill="#C9CFD8">
    <rect x="22" y="290" width="26" height="14" rx="2"/><rect x="52" y="284" width="18" height="20" rx="2"/><rect x="74" y="292" width="30" height="12" rx="2"/>
    <rect x="262" y="288" width="22" height="16" rx="2"/><rect x="288" y="280" width="16" height="24" rx="2"/><rect x="308" y="291" width="34" height="13" rx="2"/><rect x="346" y="286" width="20" height="18" rx="2"/>
  </g>

  <!-- road into the valley -->
  <path d="M182 302 L208 302 L352 470 L38 470 Z" fill="url(#road)"/>
  <path d="M182 302 L38 470" stroke="#F2F0EB" stroke-width="3" opacity=".75"/>
  <path d="M208 302 L352 470" stroke="#F2F0EB" stroke-width="3" opacity=".75"/>
  <!-- cross street and stop line -->
  <path d="M120 338 L270 338 L276 350 L114 350 Z" fill="#5B6069"/>
  <path d="M110 354 L280 354" stroke="#fff" stroke-width="3" opacity=".8"/>
  <!-- lane lines -->
  <g stroke="#F4F1E8" stroke-linecap="round" opacity=".85">
    <path d="M190 306 L186 318" stroke-width="1.6"/><path d="M182 362 L176 384" stroke-width="2.4"/><path d="M171 404 L163 436" stroke-width="3.2"/><path d="M158 452 L153 470" stroke-width="3.6"/>
    <path d="M200 306 L204 318" stroke-width="1.6"/><path d="M208 362 L214 384" stroke-width="2.4"/><path d="M219 404 L227 436" stroke-width="3.2"/><path d="M232 452 L237 470" stroke-width="3.6"/>
  </g>

  <!-- signal: pole on the right, mast arm over the road -->
  <rect x="300" y="226" width="7" height="200" rx="3" fill="#2A2F36"/>
  <rect x="226" y="230" width="81" height="6" rx="3" fill="#2A2F36"/>
  <circle cx="246" cy="300" r="34" fill="url(#glow)"/>
  <rect x="232" y="236" width="26" height="62" rx="8" fill="#1C2026"/>
  <circle cx="245" cy="249" r="7" fill="#4A2A28"/>
  <circle cx="245" cy="267" r="7" fill="#4A4026"/>
  <circle cx="245" cy="285" r="7" fill="#2BC46B"/>
  <!-- the signal's radio: waves out to the car -->
  <rect x="301" y="212" width="5" height="16" rx="2" fill="#2A2F36"/>
  <circle cx="303.5" cy="210" r="3.5" fill="#2F6BFF"/>
  <g fill="none" stroke="#2F6BFF" stroke-width="3" stroke-linecap="round">
    <path d="M291 202 A16 16 0 0 0 291 222" opacity=".9"><animate attributeName="opacity" values=".9;.25;.9" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M281 194 A28 28 0 0 0 281 230" opacity=".6"><animate attributeName="opacity" values=".6;.15;.6" dur="2.4s" begin=".3s" repeatCount="indefinite"/></path>
    <path d="M271 186 A40 40 0 0 0 271 238" opacity=".35"><animate attributeName="opacity" values=".35;.08;.35" dur="2.4s" begin=".6s" repeatCount="indefinite"/></path>
  </g>
  <!-- dotted link from the signal to the car -->
  <path d="M296 238 C 284 300, 236 340, 214 372" fill="none" stroke="#2F6BFF" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" opacity=".7"/>

  <!-- the car, from behind -->
  <g transform="translate(195 408)">
    <ellipse cx="0" cy="44" rx="74" ry="9" fill="#1E232A" opacity=".28"/>
    <rect x="-62" y="26" width="18" height="20" rx="5" fill="#1C2026"/>
    <rect x="44" y="26" width="18" height="20" rx="5" fill="#1C2026"/>
    <path d="M-44 -18 Q-40 -34 -24 -36 L24 -36 Q40 -34 44 -18 L50 -4 L-50 -4 Z" fill="#2B5FE0"/>
    <path d="M-36 -14 Q-33 -28 -21 -29 L21 -29 Q33 -28 36 -14 L39 -6 L-39 -6 Z" fill="#BFD4FF"/>
    <path d="M-30 -24 L-8 -24 L-24 -10 L-34 -10 Z" fill="#fff" opacity=".45"/>
    <rect x="-66" y="-8" width="132" height="44" rx="14" fill="url(#body)"/>
    <rect x="-60" y="2" width="26" height="10" rx="4" fill="#FF5A52"/>
    <rect x="34" y="2" width="26" height="10" rx="4" fill="#FF5A52"/>
    <rect x="-20" y="16" width="40" height="12" rx="3" fill="#F6F7F9"/>
    <rect x="-56" y="30" width="112" height="4" rx="2" fill="#1B47B8" opacity=".6"/>
  </g>

  <!-- blend into the page -->
  <rect x="0" y="446" width="390" height="24" fill="url(#fade)"/>
</svg>
